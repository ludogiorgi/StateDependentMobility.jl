[data]
input_hdf5 = "../data/fhd_chain_capillary_n32_short.h5"
covariance_hdf5 = "../data/fhd_chain_capillary_n32_phi_burstfine4k.h5"
score_bson = "../models/score_gpu2.bson"
reference_forward_hdf5 = "../data/phi_improved_forward_trajectories.h5"
burnin_fraction = 0.10
covariance_burnin_fraction = 0.00

[score]
ridge_relative = 1.0e-8

[phi]
true_mobility_samples = 12000

[[phi.sources]]
label = "dt_0p0005"
hdf5 = "../data/fhd_chain_capillary_n32_phi_burstfine4k.h5"
stride = 1
candidate_lags = [1, 2, 3, 4, 5, 8, 10]
polynomial_degree = 2

[[phi.sources]]
label = "dt_0p005"
hdf5 = "../data/fhd_chain_capillary_n32_phi_highfreq.h5"
stride = 1
candidate_lags = [1, 2, 3, 4, 5, 8, 10, 12, 16, 20]
polynomial_degree = 2

[[phi.sources]]
label = "dt_0p05"
hdf5 = "../data/fhd_chain_capillary_n32_phi_highfreq.h5"
stride = 10
candidate_lags = [1, 2, 3, 4, 5, 8, 10, 12, 16, 20]
polynomial_degree = 2

[forward]
total_time = 80.0
burnin_time = 20.0
save_dt = 0.5
ntrajectories = 2048

[run]
seed = 20260830

[output]
hdf5_file = "../data/phi_dt_sweep_gaussian_forward.h5"
metrics_txt = "../logs/fit_Phi_dt_sweep_gaussian_metrics.txt"
figure_png = "../figures/phi_dt_sweep_gaussian_forward.png"
