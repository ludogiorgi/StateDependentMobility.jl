[data]
input_hdf5 = "../data/fhd_chain_capillary_n32_phi_burstfine4k.h5"
burnin_fraction = 0.00
max_samples = 0
train_fraction = 0.90

[model]
base_channels = 96
channel_multipliers = [1, 2, 4, 8]
kernel_size = 5
periodic = true
activation = "gelu"
normalization = "none"
init_seed = 202608003

[training]
sigma = 0.05
batch_size = 256
epochs = 80
learning_rate = 8.0e-5
epoch_subset_size = 32768
seed = 202608103

[run]
device = "gpu"
expected_smi_index = 2
visible_device_id = "0"
required_gpu_name = "RTX 5070"
train = true
evaluate = true
render = false
langevin_validate = false

[figure]
exact_score_samples = 60000
stein_samples = 100000
width = 3200
height = 2300

[langevin]
dt = 0.002
total_time = 80.0
burnin_time = 20.0
save_dt = 0.05
ntrajectories = 256
score_clip = 80.0
max_pdf_samples = 250000

[output]
model_bson = "../models/score_repair_gpu2.bson"
figure_png = "../figures/score_repair_gpu2_diagnostics.png"
langevin_hdf5 = "../data/score_repair_gpu2_langevin.h5"
langevin_figure_png = "../figures/score_repair_gpu2_langevin_validation.png"
