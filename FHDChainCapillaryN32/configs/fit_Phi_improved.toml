[data]
input_hdf5 = "../data/fhd_chain_capillary_n32_short.h5"
phi_hdf5 = "../data/fhd_chain_capillary_n32_phi_burstfine4k.h5"
external_phi_hdf5 = "../data/phi_dataonly_burstfine4k_sweep.h5"
score_bson = "../models/score_gpu2.bson"
burnin_fraction = 0.10

[phi]
estimator = "external_dataonly"
fit_max_lag = 1
fit_degree = 1
use_stein_correction = false
stein_correction_orientation = "right"
project_block_circulant = false
project_symmetric_psd = false
stein_samples = 16000
true_mobility_samples = 24000
score_calibration = "none"
score_rho_scale = 1.0
score_m_scale = 1.0

[forward]
dt = 0.0005
total_time = 80.0
burnin_time = 20.0
save_dt = 0.5
ntrajectories = 24
score_clip = 120.0

[run]
seed = 20260770
device = "gpu"
expected_smi_index = 2
visible_device_id = "0"
required_gpu_name = "RTX 5070"

[figure]
width = 3600
height = 2700

[output]
artifact_hdf5 = "../data/phi_improved_baseline_artifacts.h5"
metrics_txt = "../logs/fit_Phi_improved_metrics.txt"
phi_figure_png = "../figures/phi_improved_recovery.png"
forward_figure_png = "../figures/phi_improved_forward_comparison.png"
forward_hdf5 = "../data/phi_improved_forward_trajectories.h5"
