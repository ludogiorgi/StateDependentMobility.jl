# Data-only stationary score training for the strong FHD chain.
# Analytic score is used only in ex-post diagnostics.

[data]
input_hdf5 = "outputs/fhd_chain.h5"
burnin_fraction = 0.1
max_samples = 1048576

[model]
base_channels = 96
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
init_seed = 314159

[training]
sigma = 0.05
epochs = 100
batch_size = 8192
learning_rate = 0.00015
epoch_subset_size = 262144
use_lr_schedule = true
warmup_steps = 200
min_lr_factor = 0.08
seed = 20260620
progress = true

[figure]
stein_samples = 100000
exact_score_samples = 100000
safe_density_min = 0.05
width = 3000
height = 2200

[output]
model_bson = "outputs/score_sigma005.bson"
figure_png = "outputs/score_sigma005_diagnostics.png"
langevin_hdf5 = "outputs/score_sigma005_langevin.h5"
langevin_figure_png = "outputs/score_sigma005_langevin_validation.png"

[langevin]
dt = 0.002
total_time = 48.0
burnin_time = 8.0
save_dt = 0.04
ntrajectories = 192
score_clip = 80.0
max_pdf_samples = 250000

[run]
device = "GPU:1"
required_gpu_name = "5070"
train = false
evaluate = true
langevin_validate = true
