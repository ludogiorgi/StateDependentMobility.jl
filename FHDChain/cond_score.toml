# Direct reverse transition-score residual for the strong FHD chain.
# The frozen stationary score is learned from data; no analytic score is used
# in this DSM training objective.

[data]
input_hdf5 = "outputs/fhd_chain.h5"
score_bson = "outputs/score_sigma005.bson"
burnin_fraction = 0.1
tau_min = 0.0
tau_max_decorrelation_multiples = 0.67
lag_stride = 1

[model]
base_channels = 96
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
time_features = "fourier"
time_fourier_frequencies = 8
include_delta_input = true
init_seed = 271830
warm_start_bson = "outputs/cond_score_residual_sigma005.bson"

[training]
sigma = 0.05
epochs = 10
batches_per_epoch = 128
batch_size = 8192
learning_rate = 0.00002
use_lr_schedule = true
warmup_steps = 200
min_lr_factor = 0.08
gradient_clip_value = 1.0
target_clip_value = 20.0
stein_weight = 0.0
mean_score_weight = 0.0
seed = 20260621
progress = true

[figure]
eval_tau_count = 6
eval_pairs_per_lag = 40000
width = 3000
height = 2200

[output]
model_bson = "outputs/cond_score_residual_sigma005.bson"
figure_png = "outputs/cond_score_residual_sigma005_diagnostics.png"

[run]
device = "GPU:1"
required_gpu_name = "5070"
evaluate = true
