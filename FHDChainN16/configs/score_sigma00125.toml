# Lower-smoothing data-only stationary score refinement.
# Analytic score is used only in ex-post diagnostics.

[data]
input_hdf5 = "../data/fhd_chain_n16.h5"
burnin_fraction = 0.1
max_samples = 1572864

[model]
architecture = "unet"
init_from_bson = "../models/score_sigma0025.bson"
init_output_scale = 0.5
base_channels = 128
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
init_seed = 141421

[training]
sigma = 0.0125
epochs = 100
batch_size = 8192
learning_rate = 0.00004
epoch_subset_size = 262144
use_lr_schedule = true
warmup_steps = 120
min_lr_factor = 0.05
stein_weight = 0.0
mean_score_weight = 0.0
seed = 20260725
progress = true

[figure]
stein_samples = 120000
exact_score_samples = 120000
safe_density_min = 0.05
width = 3000
height = 2200

[output]
model_bson = "../models/score_sigma00125.bson"
figure_png = "../figures/score_sigma00125_diagnostics.png"
langevin_hdf5 = "../data/score_sigma00125_langevin.h5"
langevin_figure_png = "../figures/score_sigma00125_langevin_validation.png"

[langevin]
dt = 0.00075
total_time = 64.0
burnin_time = 12.0
save_dt = 0.04
ntrajectories = 192
score_clip = 320.0
max_pdf_samples = 250000

[run]
device = "GPU:1"
required_gpu_name = "5070"
train = true
evaluate = true
langevin_validate = true
