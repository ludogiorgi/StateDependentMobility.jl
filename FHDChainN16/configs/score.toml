# Data-only stationary score training for the N=16 strong FHD chain.
# Analytic score is used only in ex-post diagnostics.

[data]
input_hdf5 = "../data/fhd_chain_n16.h5"
burnin_fraction = 0.1
max_samples = 1572864

[model]
base_channels = 128
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
init_seed = 314159

[training]
sigma = 0.05
epochs = 160
batch_size = 8192
learning_rate = 0.00012
epoch_subset_size = 393216
use_lr_schedule = true
warmup_steps = 200
min_lr_factor = 0.08
seed = 20260720
progress = true

[figure]
stein_samples = 100000
exact_score_samples = 100000
safe_density_min = 0.05
width = 3000
height = 2200

[output]
model_bson = "../models/score_sigma005.bson"
figure_png = "../figures/score_diagnostics.png"
langevin_hdf5 = "../data/score_langevin.h5"
langevin_figure_png = "../figures/score_langevin_validation.png"

[langevin]
dt = 0.0015
total_time = 64.0
burnin_time = 12.0
save_dt = 0.04
ntrajectories = 192
score_clip = 80.0
max_pdf_samples = 250000

[run]
device = "GPU:1"
required_gpu_name = "5070"
train = true
evaluate = true
langevin_validate = true
