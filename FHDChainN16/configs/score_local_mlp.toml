# Data-only stationary score training for the N=16 strong FHD chain.
# Local equivariant DSM model; analytic score is used only in ex-post diagnostics.

[data]
input_hdf5 = "../data/fhd_chain_n16.h5"
burnin_fraction = 0.1
max_samples = 1572864

[model]
architecture = "local_mlp"
local_hidden_width = 256
local_hidden_layers = 5
base_channels = 128
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
init_seed = 271828

[training]
sigma = 0.05
epochs = 240
batch_size = 8192
learning_rate = 0.0002
epoch_subset_size = 786432
use_lr_schedule = true
warmup_steps = 300
min_lr_factor = 0.05
seed = 20260721
progress = true

[figure]
stein_samples = 100000
exact_score_samples = 100000
safe_density_min = 0.05
width = 3000
height = 2200

[output]
model_bson = "../models/score_sigma005_local_mlp.bson"
figure_png = "../figures/score_local_mlp_diagnostics.png"
langevin_hdf5 = "../data/score_local_mlp_langevin.h5"
langevin_figure_png = "../figures/score_local_mlp_langevin_validation.png"

[langevin]
dt = 0.0015
total_time = 64.0
burnin_time = 12.0
save_dt = 0.04
ntrajectories = 192
score_clip = 120.0
max_pdf_samples = 250000

[run]
device = "GPU:1"
required_gpu_name = "5070"
train = true
evaluate = true
langevin_validate = true
