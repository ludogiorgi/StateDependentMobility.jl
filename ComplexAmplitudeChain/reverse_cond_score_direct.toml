# Reverse/posterior conditional score x0 | xt for the mobility identity.
# This is the operational ComplexAmplitudeChain conditional-score model:
#   transition_score = score(x0 | xt, tau) - stationary_score(x0).
#
# Run from the repository root:
#   julia --project=. --threads 36 ComplexAmplitudeChain/reverse_cond_score.jl ComplexAmplitudeChain/reverse_cond_score_direct.toml

[data]
input_hdf5 = "outputs/complex_amplitude_chain.h5"
burnin_fraction = 0.1
tau_min = 0.09
tau_max_decorrelation_multiples = 0.67
lag_stride = 1
max_eval_pairs = 160000
shared_normalization = true

[model]
base_channels = 64
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
time_features = "fourier"
time_fourier_frequencies = 8
init_seed = 271828

[training]
sigma = 0.05
epochs = 90
batches_per_epoch = 192
batch_size = 2048
learning_rate = 0.0002
progress = true
seed = 20260524
accumulation_steps = 1
use_lr_schedule = true
warmup_steps = 400
min_lr_factor = 0.08
stein_weight = 10.0
mean_score_weight = 0.05

[sampling]
dt = 0.001
steps = 10000
burnin_steps = 2000
save_stride = 20
sample_dt = 0.02
chains = 128
seed = 20260525
progress = false

[figure]
eval_tau_count = 3
pair_offsets = [0, 1, 4]
pdf_bins = 100
max_pdf_samples = 250000
stein_samples = 4000
width = 3400
height = 3200

[output]
model_bson = "outputs/reverse_cond_score_direct_sigma005.bson"
figure_png = "outputs/reverse_cond_score_direct_sigma005_diagnostics.png"

[run]
device = "AUTO"
evaluate = false
verbose = true
