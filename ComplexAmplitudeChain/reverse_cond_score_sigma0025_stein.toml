# Reverse conditional score x0 | xt with lower smoothing and explicit posterior
# Stein / score-mean regularization.

[data]
input_hdf5 = "outputs/complex_amplitude_chain.h5"
burnin_fraction = 0.1
tau_min = 0.09
tau_max_decorrelation_multiples = 0.67
lag_stride = 2
max_eval_pairs = 120000
shared_normalization = true

[model]
in_channels = 5
base_channels = 64
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
init_seed = 271828

[training]
sigma = 0.025
epochs = 40
batches_per_epoch = 128
batch_size = 2048
learning_rate = 0.0002
progress = true
seed = 20260524
accumulation_steps = 1
use_lr_schedule = true
warmup_steps = 300
min_lr_factor = 0.08
stein_weight = 10.0
mean_score_weight = 0.05

[sampling]
dt = 0.001
steps = 10000
burnin_steps = 2000
save_stride = 20
sample_dt = 0.02
chains = 128
seed = 20260525
progress = false

[figure]
eval_tau_count = 3
pair_offsets = [0, 1, 4]
pdf_bins = 100
max_pdf_samples = 250000
stein_samples = 4000
width = 3400
height = 3200

[output]
model_bson = "outputs/reverse_cond_score_sigma0025_stein.bson"
figure_png = "outputs/reverse_cond_score_sigma0025_stein_diagnostics.png"

[run]
device = "AUTO"
evaluate = false
verbose = true
