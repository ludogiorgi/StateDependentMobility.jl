# Parameters for ComplexAmplitudeChain/sim.jl.
# Run from the repository root, for example:
#   julia --project=. --threads 36 ComplexAmplitudeChain/sim.jl ComplexAmplitudeChain/sim.toml

[simulation]
K = 16
alpha = 0.70
beta = 0.08
kappa = 0.20
d0 = 0.30
d1 = 0.04
omega0 = 2.20
omega1 = 0.15

t0 = 0.0
dt = 0.01
ntrajectories = 72
requested_threads = 36
seed = 20260519

# Production output resolution. With the current pilot estimate t_D=3 and
# dt=0.01, this gives save_dt=0.03 and save_every=3.
production_snapshots_per_decorrelation = 100

[initial_condition]
q0 = 0.0
p0 = 0.0
perturb_site = 1
perturb_q = 0.05
perturb_p = 0.0

[reference_l96]
# Used only to match the L96 simulation's sampling budget.
hdf5_file = "../L96/outputs/l96_correlated_noise.h5"
fallback_t_total = 5000.0
fallback_t_decorrelation = 1.8
fallback_save_dt = 0.05
fallback_saved_intervals = 100000

[calibration]
pilot_t1 = 320.0
pilot_save_dt = 0.05
pilot_burnin_fraction = 0.25
pilot_correlation_stride = 2
pilot_max_decorrelation_time = 160.0
decorrelation_threshold = 0.05

[statistics]
burnin_fraction = 0.1
histogram_bins = 160
correlation_stride = 4
max_correlation_lags = 360
cross_offsets = [1, 2, 4, 8]
bivariate_offsets = [1, 4, 8]
max_pdf_samples = 500000

[figure]
width = 2600
height = 2100
dynamics_width = 2400
dynamics_height = 1700
dynamics_window_decorrelation_times = 20.0
dynamics_trajectory = 1
dynamics_max_frames = 2500
dynamics_trace_sites = [1, 5, 9, 13]

[output]
hdf5_file = "outputs/complex_amplitude_chain.h5"
figure_png = "outputs/complex_amplitude_chain_summary.png"
dynamics_figure_png = "outputs/complex_amplitude_chain_dynamics.png"
