# Reverse transition residual score for the complex-amplitude chain.
# The U-Net learns only:
#   r_tau(x0, xt) = grad_x0 log p_tau(xt | x0)
# through the posterior DSM objective
#   stationary_score_theta(x0_noisy) + r_theta(x0_noisy, xt, tau).
#
# The stationary score model is learned from data and frozen; no analytic score
# is used in training.

[data]
input_hdf5 = "outputs/complex_amplitude_chain.h5"
score_bson = "outputs/score_no_batchnorm_sigma005.bson"
burnin_fraction = 0.1
tau_min = 0.09
tau_max_decorrelation_multiples = 0.67
lag_stride = 1
max_eval_pairs = 160000
shared_normalization = true

[model]
base_channels = 64
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
time_features = "fourier"
time_fourier_frequencies = 8
include_delta_input = true
init_seed = 271830

[training]
score_target = "transition_residual"
sigma = 0.05
epochs = 120
batches_per_epoch = 224
batch_size = 2048
learning_rate = 0.0002
progress = true
seed = 20260526
accumulation_steps = 1
use_lr_schedule = true
warmup_steps = 400
min_lr_factor = 0.08
stein_weight = 0.0
mean_score_weight = 0.0

[sampling]
dt = 0.001
steps = 10000
burnin_steps = 2000
save_stride = 20
sample_dt = 0.02
chains = 128
seed = 20260527
progress = false

[figure]
eval_tau_count = 3
pair_offsets = [0, 1, 4]
pdf_bins = 100
max_pdf_samples = 250000
stein_samples = 4000
width = 3400
height = 3200

[output]
model_bson = "outputs/reverse_cond_score_residual_delta_sigma005.bson"
figure_png = "outputs/reverse_cond_score_residual_delta_sigma005_diagnostics.png"

[run]
device = "GPU:0"
evaluate = false
verbose = true
