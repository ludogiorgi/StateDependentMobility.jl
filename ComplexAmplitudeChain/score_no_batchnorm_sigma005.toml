# Data-only DSM stationary score fine-tuning without BatchNorm.
# Warm-starts from the data-only sigma=0.1 no-BatchNorm DSM checkpoint and
# refines the DSM objective at smaller noise. Analytic score is diagnostic-only.

[data]
input_hdf5 = "outputs/complex_amplitude_chain.h5"
burnin_fraction = 0.1
data_every = 1
max_samples = 1048576
shared_normalization = true

[model]
in_channels = 2
base_channels = 96
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
init_seed = 314159
warm_start_bson = "outputs/score_no_batchnorm.bson"

[training]
sigma = 0.05
epochs = 80
batch_size = 8192
learning_rate = 0.00012
shuffle = true
progress = true
seed = 20260615
accumulation_steps = 1
use_lr_schedule = true
warmup_steps = 100
min_lr_factor = 0.1
epoch_subset_size = 262144

[sampling]
dt = 0.001
steps = 40000
burnin_steps = 4000
save_stride = 20
sample_dt = 0.02
chains = 256
seed = 20260616
progress = false

[figure]
pair_offsets = [0, 1, 4, 8]
pdf_bins = 120
max_pdf_samples = 400000
stein_samples = 80000
exact_score_samples = 80000
spectrum_samples = 200000
width = 3200
height = 2600

[output]
model_bson = "outputs/score_no_batchnorm_sigma005.bson"
figure_png = "outputs/score_no_batchnorm_sigma005_diagnostics.png"

[run]
device = "AUTO"
evaluate = false
verbose = true
