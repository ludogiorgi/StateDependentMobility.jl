# Wider sigma=0.05 joint score for the true-M Cdot diagnostic.
# Kept at three UNet levels because K=16 cannot support the four-level periodic bottleneck.

[data]
input_hdf5 = "outputs/complex_amplitude_chain.h5"
burnin_fraction = 0.1
tau_min = 0.09
tau_max_decorrelation_multiples = 0.67
lag_stride = 2
max_eval_pairs = 120000
shared_normalization = true

[model]
in_channels = 5
base_channels = 96
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
init_seed = 314159

[training]
sigma = 0.05
epochs = 70
batches_per_epoch = 128
batch_size = 1536
learning_rate = 0.0002
progress = true
seed = 20260528
accumulation_steps = 1
use_lr_schedule = true
warmup_steps = 250
min_lr_factor = 0.1

[sampling]
dt = 0.001
steps = 10000
burnin_steps = 2000
save_stride = 20
sample_dt = 0.02
chains = 128
seed = 20260529
progress = false

[figure]
eval_tau_count = 3
pair_offsets = [0, 1, 4]
pdf_bins = 100
max_pdf_samples = 250000
stein_samples = 4000
width = 3400
height = 3200

[output]
model_bson = "outputs/joint_score_sigma005_wide.bson"
figure_png = "outputs/joint_score_sigma005_wide_diagnostics.png"

[run]
device = "AUTO"
evaluate = false
verbose = true
