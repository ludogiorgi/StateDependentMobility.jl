# First-stage mobility fit for the stochastic complex-amplitude chain.
# This stage stops after:
#   dataset/model loading;
#   conditional-score construction;
#   data-only Cdot and Phi estimation;
#   linear coefficient fit for local state-dependent mobility corrections;
#   <M>=Phi diagnostics.
#
# Run from the repository root:
#   julia --project=. --threads 36 ComplexAmplitudeChain/fit_dM.jl ComplexAmplitudeChain/fit_dM.toml

[data]
input_hdf5 = "outputs/complex_amplitude_chain.h5"
score_bson = "outputs/score_no_batchnorm_sigma005.bson"
joint_score_bson = "outputs/joint_score_sigma005.bson"
reverse_cond_score_bson = "outputs/reverse_cond_score_residual_delta_sigma005.bson"
burnin_fraction = 0.1

[evaluation]
# Positive lags used for finite-lag mobility constraints.  The joint score was
# trained on [0.09, 9.0]; this first fit uses the early part where the
# conditional-score signal is strongest.
tau_min = 0.09
tau_max = 3.0
lag_stride = 2
max_fit_lags = 32

# Monte Carlo sample counts.  Increase these after the algebra is settled.
pairs_per_lag_correlation = 60000
pairs_per_lag_phi = 500000
pairs_per_lag_operator = 60000
batch_size = 2048
score_batch_size = 2048
joint_batch_size = 2048
conditional_score_source = "reverse"

# Short-lag derivative at zero for Phi from coordinate correlations only.
phi_fit_max_lag = 1
phi_fit_degree = 2
phi_projection = "local_complex"
phi_offsite_warn_ratio = 0.05

# Local derivative estimates for finite-lag Cdot targets.
cdot_local_window = 9
cdot_poly_degree = 3

# Ridge is applied only to the two-coefficient linear system for the
# zero-mean state-dependent correction.
ridge = 1.0e-8

[observables]
# phi_n(x0) is fixed to the full coordinate vector x0.
# phi_m(xt) includes coordinate, cubic amplitude-coordinate, local amplitude,
# and nearest-neighbor dot/cross probes.
include_coordinates = true
include_cubic_amplitude_coordinates = true
include_amplitude_power_coordinates = true
include_local_amplitude = true
include_laplacian_coordinates = true
include_neighbor_weighted_coordinates = true
neighbor_offsets = [1, 2, 4]
amplitude_coordinate_powers = [2, 3]
max_selected_observables = 10
selection_min_signal_fraction = 0.06
selection_min_snr = 2.5
selection_max_roughness = 2.0
selection_max_generator_rel = 0.14
selection_force_coordinates = true

[output]
artifact_bson = "outputs/fit_dM_artifacts.bson"
metrics_txt = "outputs/fit_dM_metrics.txt"
figure_png = "outputs/fit_dM_cdot_trueM.png"

[run]
mode = "cdot_plot_only"
device = "GPU:0"
seed = 20260507
verbose = true
