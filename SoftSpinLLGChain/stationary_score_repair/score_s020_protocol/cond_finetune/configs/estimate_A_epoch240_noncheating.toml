# Strict 11-family data-only A_mn target for the epoch-240 GPU2-VR stationary score.
# A = saved data-only Cdot_data - Phi-GFDT recomputed with the branch score and Phi.

[inputs]
input_hdf5 = "../../../../../SoftSpinLLGChain/data/soft_spin_llg_chain.h5"
analytic_target_bson = "../../../../../SoftSpinLLGChain/models/mobility11/analytic/A_target.bson"
score_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/score_protocol_gpu2_score_vr_big.bson"
phi_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/fit_Phi_gpu2_vr_epoch240_seed0505_artifacts.bson"

[data]
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[estimator]
pairs_per_lag = 120000
score_batch_size = 4096
seed = 2026060912

[outputs]
target_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/A_epoch240_noncheating.bson"
metrics_txt = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/logs/A_epoch240_noncheating.txt"
figure_png = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/figures/A_epoch240_noncheating_vs_reference.png"

[run]
device = "GPU:1"
required_gpu_name = "2080"
