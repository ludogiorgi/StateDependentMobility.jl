# Forward-only wrapper for the selected epoch-240 transferred-residual M_NN snapshot on GPU2.

[data]
input_hdf5 = "../../../../../SoftSpinLLGChain/data/soft_spin_llg_chain.h5"
score_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/score_protocol_gpu2_score_vr_big.bson"
cond_score_kind = "transferred_residual"
cond_score_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/models/cond_repaired_score_gpu2_main_epoch0720.bson"
cond_score_config = "../../../../../SoftSpinLLGChain/stationary_score_repair/configs/cond_repaired_score_gpu2_main.toml"
phi_artifact_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/fit_Phi_gpu2_vr_epoch240_seed0505_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[targets]
target_kind = "data_only"
scale_source = "global_active_rms"
retained_channels_toml = "../../../../../SoftSpinLLGChain/configs/nonlinear_observable_mobility_expanded_score_terms.toml"
target_artifact_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/A_epoch240_noncheating_globalscale.bson"
max_lags = 40
target_pairs_per_lag = 120000
target_mean_samples = 180000
orthogonalize_radial_basis = true
radial_basis_samples = 180000

[model]
feature_mode = "neighbor_r2"
hidden_width = 256
hidden_depth = 4
sym_scale = 0.40
skew_scale = 7.60
sym_floor = 0.00001
init_to_phi = true
init_to_phi_final_weight_scale = 0.01

[training]
epochs = 1
batches_per_epoch = 1
batch_pairs = 8192
cache_pairs_per_lag = 60000
learning_rate = 0.00003
weight_decay = 1.0e-7
mean_penalty_weight = 0.0
operator_sign = -1.0
phi_residual_sign = 1.0
mean_penalty_samples = 4096
eval_pairs_per_lag = 60000
eval_every = 1
first_lag_index = 7
last_lag_index = 24
lag_weight_mode = "uniform"
seed = 2026060926

[output]
model_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/M_epoch240_transfer_warm_gpu1_best_snapshot_forward.bson"
metrics_txt = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/logs/M_epoch240_transfer_warm_best_forward_gpu2_unused_metrics.txt"
figure_png = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/figures/M_epoch240_transfer_warm_best_forward_gpu2_unused.png"

[run]
device = "GPU:2"
required_gpu_name = "5070"
prepare_targets = false
train = false
evaluate = false
verbose = true
skip_true_m_diagnostics = true
