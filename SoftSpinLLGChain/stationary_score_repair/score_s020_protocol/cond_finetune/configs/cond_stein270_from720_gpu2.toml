[data]
input_hdf5 = "../../../../../SoftSpinLLGChain/data/soft_spin_llg_chain.h5"
score_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/score_protocol_gpu2_score_vr_stein_meantrust_cont_from260.bson"
phi_artifact_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/fit_Phi_gpu2_vr_stein_epoch270_seed0505_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[model]
architecture = "unet"
base_channels = 128
channel_multipliers = [1, 2]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
include_delta_input = true
include_tau_scalar = false
time_fourier_frequencies = 8
init_seed = 2026060904

[training]
sigma = 0.05
epochs = 300
batches_per_epoch = 384
batch_size = 2048
learning_rate = 0.00004
use_lr_schedule = true
warmup_steps = 0
min_lr_factor = 0.10
gradient_clip_value = 0.0
target_clip_value = 0.0
mean_score_weight = 0.001
stein_weight = 0.0005
lag_sampling_power = 1.0
train_min_lag_step = 0
train_max_lag_step = 0
score_target = "residual"
residual_output_scale = "sigma"
checkpoint_every = 20
resume = true
seed = 2026060904

[diagnostics]
eval_tau_count = 8
eval_pairs_per_lag = 60000
operator_pairs_per_lag = 50000
operator_lag_count = 24

[figure]
width = 3400
height = 2600

[output]
model_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/cond_stein270_from720_gpu2.bson"
figure_png = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/figures/cond_stein270_from720_gpu2_diagnostics.png"
metrics_txt = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/logs/cond_stein270_from720_gpu2_metrics.txt"

[run]
device = "GPU:2"
required_gpu_name = "5070"
train = true
evaluate = false
verbose = true
