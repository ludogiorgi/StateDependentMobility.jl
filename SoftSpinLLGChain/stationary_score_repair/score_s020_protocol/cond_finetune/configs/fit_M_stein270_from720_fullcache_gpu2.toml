# Full-cache strict 11-family M_NN fit matched to the Stein epoch-270 stationary
# score and the low-LR fine-tuned conditional residual branch.

[data]
input_hdf5 = "../../../../../SoftSpinLLGChain/data/soft_spin_llg_chain.h5"
score_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/score_protocol_gpu2_score_vr_stein_meantrust_cont_from260.bson"
cond_score_kind = "conditional_residual"
cond_score_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/cond_stein270_lowlr_from720_gpu2.bson"
cond_score_config = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/configs/cond_stein270_lowlr_from720_gpu2.toml"
phi_artifact_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/models/fit_Phi_gpu2_vr_stein_epoch270_seed0505_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[targets]
target_kind = "data_only"
scale_source = "data_channel"
retained_channels_toml = "../../../../../SoftSpinLLGChain/configs/nonlinear_observable_mobility_expanded_score_terms.toml"
target_artifact_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/A_stein270_noncheating.bson"
max_lags = 40
target_pairs_per_lag = 120000
target_mean_samples = 180000
orthogonalize_radial_basis = true
radial_basis_samples = 180000

[model]
feature_mode = "neighbor_all_r2"
hidden_width = 320
hidden_depth = 4
sym_scale = 0.40
skew_scale = 7.60
sym_floor = 0.00001
init_to_phi = true
init_to_phi_final_weight_scale = 0.01

[training]
epochs = 180
batches_per_epoch = 56
batch_pairs = 8192
cache_pairs_per_lag = 60000
learning_rate = 0.000025
weight_decay = 1.0e-7
mean_penalty_weight = 2.0
operator_sign = -1.0
phi_residual_sign = 1.0
mean_penalty_samples = 4096
eval_pairs_per_lag = 60000
eval_every = 2
first_lag_index = 7
last_lag_index = 24
lag_weight_mode = "uniform"
seed = 2026060915

[fullcache]
output_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/M_stein270_lowlr_from720_fullcache_gpu2.bson"
metrics_txt = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/logs/M_stein270_lowlr_from720_fullcache_gpu2_metrics.txt"
epochs = 180
eval_every = 2
cache_pairs_per_lag = 60000
learning_rate = 0.000025
mean_penalty_weight = 2.0
mean_penalty_mode = "full"
loss_scale_mode = "global"
train_pair_batch_size = 30000
save_eval_checkpoints_every = 20
signal_weight_threshold = 0.02
signal_weight_power = 2.0
signal_weight_min = 0.05

[output]
model_bson = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/models/M_stein270_lowlr_from720_gpu2.bson"
metrics_txt = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/logs/M_stein270_lowlr_from720_gpu2_metrics.txt"
figure_png = "../../../../../SoftSpinLLGChain/stationary_score_repair/score_s020_protocol/cond_finetune/figures/M_stein270_lowlr_from720_gpu2_diagnostics.png"

[run]
device = "GPU:2"
required_gpu_name = "5070"
prepare_targets = false
train = true
evaluate = true
verbose = true
skip_true_m_diagnostics = true
