# Strict conditional residual score using the accepted repaired data-only score.
# Launch only after fit_Phi_repaired_score.toml has produced its Phi artifact.

[data]
input_hdf5 = "../../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_largecnn_s020_e140_gpu1_probe_epoch0160.bson"
phi_artifact_bson = "../models/fit_Phi_repaired_score_seed0505_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[model]
architecture = "unet"
base_channels = 128
channel_multipliers = [1, 2]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
include_delta_input = true
include_tau_scalar = false
time_fourier_frequencies = 8
init_seed = 2026060502

[training]
sigma = 0.05
epochs = 720
batches_per_epoch = 384
batch_size = 2048
learning_rate = 0.00008
use_lr_schedule = true
warmup_steps = 0
min_lr_factor = 0.04
gradient_clip_value = 0.0
target_clip_value = 0.0
mean_score_weight = 0.001
stein_weight = 0.0005
lag_sampling_power = 1.0
train_min_lag_step = 0
train_max_lag_step = 0
score_target = "residual"
residual_output_scale = "sigma"
checkpoint_every = 20
resume = true
seed = 2026060502

[diagnostics]
eval_tau_count = 8
eval_pairs_per_lag = 60000
operator_pairs_per_lag = 50000
operator_lag_count = 24

[figure]
width = 3400
height = 2600

[output]
model_bson = "../models/cond_repaired_score_gpu2_main.bson"
figure_png = "../figures/cond_repaired_score_gpu2_main_diagnostics.png"
metrics_txt = "../logs/cond_repaired_score_gpu2_main_metrics.txt"

[run]
device = "GPU:2"
required_gpu_name = "5070"
train = true
evaluate = true
verbose = true
