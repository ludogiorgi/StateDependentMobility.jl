# Structured conditional residual score with inverse-lag physical features.
# Launch with CUDA_VISIBLE_DEVICES=2 in this workstation mapping.

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
phi_artifact_bson = "../models/fit_Phi_phys_pC_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[model]
architecture = "physical_mlp"
normalization = "none"
include_delta_input = true
include_tau_scalar = true
time_fourier_frequencies = 8
physical_hidden_width = 160
physical_hidden_depth = 5
physical_output_scale = 1.0
base_channels = 32
channel_multipliers = [1]
kernel_size = 3
periodic = true
activation = "swish"
final_activation = "identity"
init_seed = 2026051333

[training]
sigma = 0.05
epochs = 60
batches_per_epoch = 384
batch_size = 4096
learning_rate = 0.00025
use_lr_schedule = true
warmup_steps = 700
min_lr_factor = 0.08
gradient_clip_value = 0.0
target_clip_value = 0.0
mean_score_weight = 0.0005
stein_weight = 0.0010
lag_sampling_power = 1.20
score_target = "residual"
checkpoint_every = 5
resume = true
seed = 2026051333

[diagnostics]
eval_tau_count = 8
eval_pairs_per_lag = 60000
operator_pairs_per_lag = 50000
operator_lag_count = 24

[figure]
width = 3400
height = 2600

[output]
model_bson = "../models/cond_score_phys_pC_vU.bson"
figure_png = "../figures/cond_score_phys_pC_vU_diagnostics.png"
metrics_txt = "../logs/cond_score_phys_pC_vU_metrics.txt"

[run]
device = "GPU:1"
required_gpu_name = "2080ti"
train = true
evaluate = true
verbose = true
