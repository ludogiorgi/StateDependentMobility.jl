# U-Net conditional residual score, wider lag weighting and larger kernel.
# Launch with CUDA_VISIBLE_DEVICES=2 in this workstation mapping (RTX 2080 Ti).

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
phi_artifact_bson = "../models/fit_Phi_phys_pC_dataonly_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[model]
architecture = "unet"
base_channels = 96
channel_multipliers = [1, 2, 2]
kernel_size = 7
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
include_delta_input = true
include_tau_scalar = false
time_fourier_frequencies = 10
init_seed = 2026051343

[training]
sigma = 0.05
epochs = 150
batches_per_epoch = 384
batch_size = 1536
learning_rate = 0.00018
use_lr_schedule = true
warmup_steps = 600
min_lr_factor = 0.08
gradient_clip_value = 0.0
target_clip_value = 0.0
mean_score_weight = 0.001
stein_weight = 0.0005
lag_sampling_power = 1.8
score_target = "residual"
checkpoint_every = 5
resume = true
seed = 2026051343

[diagnostics]
eval_tau_count = 8
eval_pairs_per_lag = 60000
operator_pairs_per_lag = 50000
operator_lag_count = 24

[figure]
width = 3400
height = 2600

[output]
model_bson = "../models/cond_score_phys_pC_unet_vC.bson"
figure_png = "../figures/cond_score_phys_pC_unet_vC_diagnostics.png"
metrics_txt = "../logs/cond_score_phys_pC_unet_vC_metrics.txt"

[run]
device = "GPU:1"
required_gpu_name = "2080ti"
train = true
evaluate = true
verbose = true
