# Data-only M training on the best oracle-discovered coordinate-phi_n library.

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
cond_score_kind = "joint_score"
cond_score_bson = "../models/joint_score_phys_pC_gpu2_vL_physaug_groupnorm_active_moment.bson"
cond_score_config = "joint_score_phys_pC_gpu2_vL_physaug_groupnorm_active_moment.toml"
phi_artifact_bson = "../models/fit_Phi_phys_pC_dataonly_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[targets]
target_kind = "data_only"
scale_source = "data_target"
retained_channels_toml = "../configs/nonlinear_observable_retained_channels_oracle_ident_v1.toml"
target_artifact_bson = "../models/dM_targets_dataonly_oracle_ident_v1_datascale.bson"
max_lags = 24
target_pairs_per_lag = 120000
target_mean_samples = 180000

[model]
feature_mode = "equivariant_r2"
hidden_width = 160
hidden_depth = 4
sym_scale = 0.16
skew_scale = 1.05
sym_floor = 0.00001

[training]
epochs = 100
batches_per_epoch = 128
batch_pairs = 4096
cache_pairs_per_lag = 40000
learning_rate = 0.00022
weight_decay = 1.0e-6
mean_penalty_weight = 1.0
mean_penalty_samples = 8192
eval_pairs_per_lag = 40000
eval_every = 5
first_lag_index = 7
last_lag_index = 0
seed = 2026051643

[output]
model_bson = "../models/dM_phys_pC_dataonly_oracle_ident_v1_datascale_gpu2_equiv_lowmean.bson"
metrics_txt = "../logs/dM_phys_pC_dataonly_oracle_ident_v1_datascale_gpu2_equiv_lowmean_metrics.txt"
figure_png = "../figures/dM_phys_pC_dataonly_oracle_ident_v1_datascale_gpu2_equiv_lowmean_diagnostics.png"

[run]
device = "GPU:2"
required_gpu_name = "5070"
prepare_targets = false
train = true
evaluate = true
verbose = true
