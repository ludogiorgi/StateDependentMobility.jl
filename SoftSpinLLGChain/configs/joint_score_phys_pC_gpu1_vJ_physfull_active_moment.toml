# Third-wave joint-score branch on the second RTX 2080 Ti.
# Physical-full features, active lag sampling, and stronger data-only moment penalties.
# Launch with CUDA_VISIBLE_DEVICES=2 on this workstation.

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
phi_artifact_bson = "../models/fit_Phi_phys_pC_dataonly_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[model]
feature_mode = "physical_full"
base_channels = 128
channel_multipliers = [1, 2]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
include_delta_input = true
include_tau_scalar = false
time_fourier_frequencies = 12
init_seed = 2026051511

[training]
sigma = 0.05
endpoint_noise = "both"
score_target = "residualized"
epochs = 160
batches_per_epoch = 320
batch_size = 768
learning_rate = 0.000075
use_lr_schedule = true
warmup_steps = 500
min_lr_factor = 0.05
gradient_clip_value = 0.0
target_clip_value = 0.0
initial_block_weight = 1.75
terminal_block_weight = 0.25
mean_score_weight = 0.005
stein_weight = 0.002
lag_sampling_mode = "active"
lag_sampling_power = 1.0
active_lag_first = 7
active_lag_last = 24
checkpoint_every = 10
resume = true
seed = 2026051512

[diagnostics]
eval_tau_count = 8
eval_pairs_per_lag = 50000
operator_pairs_per_lag = 50000
operator_lag_count = 24
retained_target_bson = "../models/dM_targets_compact_phys_pC_dataonly.bson"

[figure]
width = 3400
height = 2600

[output]
model_bson = "../models/joint_score_phys_pC_gpu1_vJ_physfull_active_moment.bson"
figure_png = "../figures/joint_score_phys_pC_gpu1_vJ_physfull_active_moment_diagnostics.png"
metrics_txt = "../logs/joint_score_phys_pC_gpu1_vJ_physfull_active_moment_metrics.txt"

[run]
device = "GPU:1"
required_gpu_name = "2080ti"
train = true
evaluate = true
verbose = true
