# Oracle true-M diagnostic M training.
# This is intentionally not data-only: targets use true M and Phi=<M_true>.
# Uses the best retained-active conditional score estimate, joint vL.

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
cond_score_kind = "joint_score"
cond_score_bson = "../models/joint_score_phys_pC_gpu2_vL_physaug_groupnorm_active_moment.bson"
cond_score_config = "joint_score_phys_pC_gpu2_vL_physaug_groupnorm_active_moment.toml"
phi_artifact_bson = "../models/fit_Phi_phys_pC_dataonly_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[targets]
target_kind = "oracle_trueM"
retained_channels_toml = "../configs/nonlinear_observable_retained_channels_compact.toml"
target_artifact_bson = "../models/dM_targets_oracle_trueM_vL.bson"
max_lags = 24
target_pairs_per_lag = 100000
target_mean_samples = 140000

[model]
feature_mode = "equivariant_r2"
hidden_width = 96
hidden_depth = 3
sym_scale = 0.10
skew_scale = 1.00
sym_floor = 0.00001

[training]
epochs = 100
batches_per_epoch = 112
batch_pairs = 4096
cache_pairs_per_lag = 32000
learning_rate = 0.0006
weight_decay = 1.0e-7
mean_penalty_weight = 0.35
mean_penalty_samples = 4096
eval_pairs_per_lag = 32000
eval_every = 5
first_lag_index = 7
last_lag_index = 0
seed = 2026051517

[output]
model_bson = "../models/dM_phys_pC_oracle_trueM_vL_gpu2_equiv.bson"
metrics_txt = "../logs/dM_phys_pC_oracle_trueM_vL_gpu2_equiv_metrics.txt"
figure_png = "../figures/dM_phys_pC_oracle_trueM_vL_gpu2_equiv_diagnostics.png"

[run]
device = "GPU:2"
required_gpu_name = "5070"
prepare_targets = false
train = true
evaluate = true
verbose = true
