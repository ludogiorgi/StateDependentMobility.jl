[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
burnin_fraction = 0.1
max_samples = 4194304
spin_inversion_augment = true
enforce_zero_mean = true

[model]
base_channels = 8
channel_multipliers = [1]
kernel_size = 3
periodic = true
activation = "identity"
final_activation = "identity"
normalization = "none"
output_mode = "score"
input_features = "spin"
init_seed = 1

[training]
sigma = 0.05
epochs = 1
batch_size = 16384
learning_rate = 0.0
epoch_subset_size = 0
save_best_validation = true
seed = 2026051301

[figure]
exact_score_samples = 300000
width = 3000
height = 2200

[langevin]
dt = 0.0005
total_time = 80.0
burnin_time = 16.0
save_dt = 0.04
ntrajectories = 192
score_clip = 120.0
max_pdf_samples = 500000

[output]
model_bson = "../models/score_phys_pA_sigma05.bson"
figure_png = "../figures/score_phys_pA_diagnostics.png"
langevin_hdf5 = "../data/score_phys_pA_langevin.h5"
langevin_figure_png = "../figures/score_phys_pA_langevin.png"
metrics_txt = "../logs/score_phys_pA_metrics.txt"

[run]
device = "GPU:1"
required_gpu_name = "2080ti"
train = false
evaluate = true
langevin_validate = false
