# Continued U-Net conditional residual score from vA.
# Starts from models/cond_score_phys_pC_unet_vA_cont.bson, whose checkpoint
# metadata completed epoch 160. This run extends training to epoch 240.

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
phi_artifact_bson = "../models/fit_Phi_phys_pC_dataonly_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[model]
architecture = "unet"
base_channels = 128
channel_multipliers = [1, 2]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
normalization = "none"
include_delta_input = true
include_tau_scalar = false
time_fourier_frequencies = 8
init_seed = 2026051341

[training]
sigma = 0.05
epochs = 240
batches_per_epoch = 384
batch_size = 2048
learning_rate = 0.00008
use_lr_schedule = true
warmup_steps = 0
min_lr_factor = 0.05
gradient_clip_value = 0.0
target_clip_value = 0.0
mean_score_weight = 0.001
stein_weight = 0.0005
lag_sampling_power = 1.0
score_target = "residual"
checkpoint_every = 10
resume = true
seed = 2026051361

[diagnostics]
eval_tau_count = 8
eval_pairs_per_lag = 60000
operator_pairs_per_lag = 50000
operator_lag_count = 24

[figure]
width = 3400
height = 2600

[output]
model_bson = "../models/cond_score_phys_pC_unet_vA_cont.bson"
figure_png = "../figures/cond_score_phys_pC_unet_vA_cont_diagnostics.png"
metrics_txt = "../logs/cond_score_phys_pC_unet_vA_cont_metrics.txt"

[run]
device = "GPU:2"
required_gpu_name = "5070"
train = true
evaluate = true
verbose = true
