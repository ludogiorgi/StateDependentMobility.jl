# Direct conditional physics ansatz with a larger PSD coefficient floor.

[data]
input_hdf5 = "../data/soft_spin_llg_chain.h5"
score_bson = "../models/score_phys_pC_sigma02.bson"
cond_score_kind = "conditional_residual"
cond_score_bson = "../models/cond_score_phys_pC_unet_vA_cont2.bson"
cond_score_config = "cond_score_phys_pC_unet_gpu2_vA_cont2.toml"
phi_artifact_bson = "../models/fit_Phi_phys_pC_dataonly_artifacts.bson"
burnin_fraction = 0.1
tau_max_decorrelation_multiples = 0.60
lag_stride = 1

[targets]
target_kind = "data_only"
scale_source = "data_channel"
retained_channels_toml = "../configs/nonlinear_observable_retained_channels_oracle_ident_v1_dataoracle_clean37.toml"
target_artifact_bson = "../models/dM_targets_dataonly_oracle_ident_v1_dataoracle_clean37_channelscale.bson"
max_lags = 24
target_pairs_per_lag = 120000
target_mean_samples = 180000

[model]
feature_mode = "equivariant_r2"
hidden_width = 1
hidden_depth = 1
sym_scale = 1.0
skew_scale = 1.0
sym_floor = 0.0

[training]
epochs = 1
batches_per_epoch = 1
batch_pairs = 1
cache_pairs_per_lag = 0
learning_rate = 0.0
weight_decay = 0.0
mean_penalty_weight = 0.0
mean_penalty_samples = 8192
eval_pairs_per_lag = 1
eval_every = 1
first_lag_index = 7
last_lag_index = 0
seed = 2026051717

[physical_ansatz]
first_lag_index = 7
last_lag_index = 0
design_pairs_per_lag = 70000
eval_pairs_per_lag = 50000
mean_samples = 140000
ridge = 1.0e-8
mean_penalty_weight = 100000.0
fit_intercept = false
force_psd_grid = true
symmetric_coeff_floor = 0.005

[output]
model_bson = "../models/dM_phys_ansatz_clean37_directcond_mean1e5_floor005_gpu0.bson"
metrics_txt = "../logs/dM_phys_ansatz_clean37_directcond_mean1e5_floor005_gpu0_metrics.txt"
figure_png = "../figures/dM_phys_ansatz_clean37_directcond_mean1e5_floor005_gpu0_diagnostics.png"

[run]
device = "GPU:0"
required_gpu_name = "2080ti"
prepare_targets = false
train = true
evaluate = true
verbose = true
