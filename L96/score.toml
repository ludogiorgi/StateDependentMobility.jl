# julia --project=. --threads 36 L96/score.jl L96/score.toml
# nohup julia --project=. --threads 36 L96/score.jl L96/score.toml > L96/score.log 2>&1 &

[data]
input_hdf5 = "outputs/l96_correlated_noise.h5"
burnin_fraction = 0.2
data_every = 1
max_samples = 262144
shared_normalization = true

[model]
in_channels = 1
base_channels = 32
channel_multipliers = [1, 2, 4]
kernel_size = 5
periodic = true
activation = "swish"
final_activation = "identity"
init_seed = 314159

[training]
# DSM noise scale used to corrupt training samples when constructing the score target.
sigma = 0.1
epochs = 60
batch_size = 4096
learning_rate = 0.0003
shuffle = true
progress = true
seed = 20260427
accumulation_steps = 1
use_lr_schedule = true
warmup_steps = 100
min_lr_factor = 0.05
epoch_subset_size = 0

[sampling]
dt = 0.001
steps = 40000
burnin_steps = 4000
save_stride = 20
sample_dt = 0.02
chains = 256
seed = 20260428
progress = true

[figure]
pair_offsets = [1, 2, 5, 10]
pdf_bins = 120
max_pdf_samples = 400000
stein_samples = 20000
spectrum_samples = 200000
width = 3200
height = 2600

[output]
model_bson = "outputs/score.bson"
figure_png = "outputs/score_diagnostics.png"

[run]
device = "GPU:0"
verbose = true