# Parameters for L96/sim.jl.
# Run, for example:
#   julia --project=. --threads 36 L96/sim.jl L96/sim.toml
# Set requested_threads = 0 if you want the script to run with any available thread count.

[simulation]
K = 40
F = 8.0

# Translation-invariant correlated additive noise from the manuscript:
# q_m = sigma^2 * [(1-rho) + rho * (1 + ell^2 lambda_m)^(-p) / mean_n (1 + ell^2 lambda_n)^(-p)]
sigma = 0.5
rho = 0.6
ell = 2.0
p = 2.0

t0 = 0.0
t1 = 5000.0
dt = 0.005
save_dt = 0.05
ntrajectories = 36
requested_threads = 36
seed = 12345

[initial_condition]
# Standard Lorenz--96-style initialization: start near the homogeneous state and break translation symmetry weakly.
mean = 8.0
perturb_index = 1
perturbation = 0.01

[statistics]
burnin_fraction = 0.1
histogram_bins = 160
correlation_stride = 2
decorrelation_threshold = 0.05
max_decorrelation_time = 20.0

# C_r(t) = <(x_{i+r}(t+tau)-mean)(x_i(t)-mean)> / var, averaged over i, time, and trajectories.
cross_offsets = [1, 2, 5, 10, 20]

# Bivariate PDFs are averaged over all pairs (x_i, x_{i+r}) with the same offset r.
bivariate_offsets = [1, 2, 5, 10]

# Cap the random samples used for KDE diagnostics. Raw trajectories are still saved in full.
max_pdf_samples = 500000

[figure]
width = 2600
height = 2100

[output]
hdf5_file = "outputs/l96_correlated_noise.h5"
figure_png = "outputs/l96_correlated_noise_summary.png"
